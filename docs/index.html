<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101828"><title>90天英语学习打卡</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:600px;margin:auto;padding:22px 18px 100px}header{background:#101828;color:white;padding:30px 24px;border-radius:24px}h1{margin:6px 0;font-size:27px}p{line-height:1.6}.muted{color:#758196;font-size:13px}.white{color:#b8c5d8}.panel{background:white;border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 5px 24px #1d29400a}h2{font-size:18px;margin:0 0 16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{border-radius:50px;background:#edf2ff;color:#345bd9;padding:7px 12px;font-size:12px;font-weight:700}.bar{height:10px;border-radius:12px;background:#e9edf4;overflow:hidden;margin:16px 0}.fill{height:100%;background:#3768f6;transition:width .2s}button{border:0;background:#3867f6;color:white;border-radius:12px;padding:13px 15px;font-size:14px;font-weight:600;cursor:pointer}button.secondary{background:#eef2fa;color:#24334b}button:disabled{opacity:.45}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{padding:9px 2px;border-radius:11px;background:#f0f3f8;color:#27364b;font-size:12px;text-align:center}.day.active{background:#3867f6;color:white}.day.done{background:#d8f5e6;color:#13794a}.task{display:flex;gap:12px;align-items:flex-start;padding:15px 0;border-bottom:1px solid #edf0f5}.task input{width:22px;height:22px;accent-color:#3867f6}.task strong{display:block}.task small{color:#758196;display:block;margin-top:5px;line-height:1.5}textarea{width:100%;min-height:100px;border:1px solid #e1e6ee;border-radius:12px;padding:12px;font:inherit;resize:vertical}select{border:1px solid #d9e1ed;border-radius:10px;padding:9px;background:white}footer{text-align:center;margin-top:22px;color:#8792a3;font-size:12px}</style></head><body><main class="wrap"><header><div class="white">ENGLISH · 90 DAY CHALLENGE</div><h1>每天进步一点点</h1><p class="white">每天120分钟 · 早上40分钟 + 晚上80分钟</p><div class="row"><span id="progressText">0 / 90 天</span><span id="percent">0%</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="white">开始日期：2026年10月12日</div></header><section class="panel"><div class="row"><h2>学习日历</h2><select id="page"></select></div><div class="days" id="days"></div></section><section class="panel"><div class="row"><h2 id="heading">Day 1</h2><span class="pill" id="phase"></span></div><p id="date" class="muted"></p><div id="tasks"></div><div class="row" style="margin-top:18px"><button class="secondary" id="prev">上一天</button><button id="all">完成今日全部任务</button><button class="secondary" id="next">下一天</button></div></section><section class="panel"><h2>学习笔记</h2><textarea id="notes" placeholder="记录今天不熟悉的发音、单词和句型……"></textarea><p class="muted">笔记自动保存到当前浏览器。换设备或清除浏览器数据可能丢失记录，请定期导出。</p><div class="row"><button class="secondary" id="export">导出备份</button><button class="secondary" id="import">导入备份</button><input type="file" id="file" accept="application/json" hidden></div></section><footer>学习节奏可按实际掌握情况调整 · 90天英语打卡</footer></main><script>
const START=new Date(2026,9,12),N=90,KEY="abao-english-90-v1";let data={checks:{},notes:{}};try{const v=JSON.parse(localStorage.getItem(KEY)||"{}");data={checks:v.checks||{},notes:v.notes||{}}}catch(e){}const save=()=>localStorage.setItem(KEY,JSON.stringify(data));let current=Math.max(1,Math.min(90,Math.floor((new Date().setHours(0,0,0,0)-START.getTime())/86400000)+1));function info(n){if(n<=12)return {phase:"音标课",course:"音标第"+((n-1)*4+1)+"–"+(n*4)+"节",morning:"复习已学音标20分钟 + 跟读辨音20分钟",evening:"观看音标录播40分钟 + 口型、辨音与单词发音练习40分钟"};if(n<=32){let a=(n-13)*5+1;return {phase:"自然拼读",course:"自然拼读第"+a+"–"+(a+4)+"节",morning:"音标复习20分钟 + 单词拼读20分钟",evening:"观看拼读录播35分钟 + 拼读规则练习25分钟 + 听写与跟读20分钟"}}if(n<=62){let x=n-33,w=Math.floor(x/7),r=x%7,counts=[2,1,2,1,2,1,1],offset=counts.slice(0,r).reduce((a,b)=>a+b,0),a=w*10+offset+1,b=a+counts[r]-1;return {phase:"新概念",course:"新概念第"+a+(a===b?"":"–"+b)+"节",morning:"复习前一天句型20分钟 + 课文听力跟读20分钟",evening:"观看新概念录播 "+(counts[r]*24)+"分钟 + 单词、句型、复述与口语练习 "+(80-counts[r]*24)+"分钟"}}let x=n-63,w=Math.floor(x/7),r=x%7;if(r===6)return {phase:"复习测验",course:"本周复习与测验",morning:"本周词汇20分钟 + 课文跟读20分钟",evening:"听力测验30分钟 + 口语复述30分钟 + 错题整理20分钟"};if(r===1||r===3)return {phase:"语法课",course:"语法第"+(w*2+(r===1?1:2))+"节（按课文主题调整）",morning:"新概念句型复习20分钟 + 听力20分钟",evening:"语法录播25分钟 + 例句理解25分钟 + 自主造句30分钟"};let order=[0,2,4,5].indexOf(r),a=44+w*8+order*2;return {phase:"新概念",course:"新概念第"+a+"–"+(a+1)+"节",morning:"课文复习20分钟 + 跟读20分钟",evening:"新概念录播48分钟 + 句型练习与口语32分钟"}}function complete(n){return [0,1,2].every(i=>data.checks[n+"-"+i])}function render(){const i=info(current),date=new Date(START);date.setDate(date.getDate()+current-1);document.getElementById("heading").textContent="Day "+current+" · "+i.course;document.getElementById("phase").textContent=i.phase;document.getElementById("date").textContent=date.toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"});let tasks=[["早上 · 40分钟",i.morning],["晚上 · 80分钟",i.evening],["今日完成确认","回顾今天所学，确保能够独立说出或完成主要练习"]];document.getElementById("tasks").innerHTML=tasks.map((t,j)=>'<label class="task"><input type="checkbox" data-task="'+j+'" '+(data.checks[current+"-"+j]?"checked":"")+'><span><strong>'+t[0]+'</strong><small>'+t[1]+'</small></span></label>').join("");document.querySelectorAll("[data-task]").forEach(el=>el.onchange=()=>{data.checks[current+"-"+el.dataset.task]=el.checked;save();render()});document.getElementById("notes").value=data.notes[current]||"";let done=Array.from({length:N},(_,k)=>k+1).filter(complete).length;document.getElementById("progressText").textContent=done+" / 90 天";document.getElementById("percent").textContent=Math.round(done/N*100)+"%";document.getElementById("fill").style.width=done/N*100+"%";document.getElementById("page").value=Math.floor((current-1)/15);document.getElementById("days").innerHTML=Array.from({length:15},(_,j)=>{let d=Math.floor((current-1)/15)*15+j+1;return '<button class="day '+(d===current?"active":complete(d)?"done":"")+'" data-day="'+d+'">D'+d+'</button>'}).join("");document.querySelectorAll("[data-day]").forEach(el=>el.onclick=()=>{current=+el.dataset.day;render()});document.getElementById("prev").disabled=current===1;document.getElementById("next").disabled=current===90}const page=document.getElementById("page");for(let i=0;i<6;i++){let o=document.createElement("option");o.value=i;o.textContent="Day "+(i*15+1)+"–"+((i+1)*15);page.append(o)}page.onchange=()=>{current=+page.value*15+1;render()};document.getElementById("prev").onclick=()=>{current--;render()};document.getElementById("next").onclick=()=>{current++;render()};document.getElementById("all").onclick=()=>{for(let i=0;i<3;i++)data.checks[current+"-"+i]=true;save();render()};document.getElementById("notes").oninput=e=>{data.notes[current]=e.target.value;save()};document.getElementById("export").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.href=u;a.download="英语90天打卡备份.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.getElementById("import").onclick=()=>document.getElementById("file").click();document.getElementById("file").onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!v.checks||!v.notes)throw Error("格式不正确");if(confirm("导入将覆盖当前打卡数据，继续吗？")){data=v;save();render()}}catch(err){alert("导入失败："+err.message)}};render();</script></body></html>
